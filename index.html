<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAĞMANCI KUYUMCULUK & SAAT | Şanlıurfa Eyyübiye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-base: #020605;
      --card-glass: rgba(4, 15, 12, 0.88);
      --card-border: rgba(212, 175, 55, 0.32);
      --gold-primary: #d4af37;
      --gold-light: #f7e8c3;
      --gold-dark: #917222;
      --text-pearl: #f7f6f2;
      --text-muted: #a3b3ae;
      --emerald-accent: #34d399;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-base);
      background-image: radial-gradient(circle at 50% 15%, rgba(2, 6, 5, 0.75) 0%, rgba(2, 6, 5, 0.94) 85%), url('arka-plan.jpg');
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      color: var(--text-pearl);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    /* HEADER */
    header {
      width: 100%;
      background: rgba(2, 7, 6, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
    }
    .brand-logo {
      font-family: 'Cinzel', 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-decoration: none;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
    }
    .brand-sub {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--emerald-accent);
      text-transform: uppercase;
      font-weight: 600;
    }
    .header-location {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-location i { color: var(--gold-primary); font-size: 10px; }

    /* BANNER */
    .banner-container { width: 100%; max-width: 960px; margin: 22px auto 0; padding: 0 16px; }
    .hero-banner {
      position: relative;
      width: 100%;
      height: 240px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.8), 0 0 25px rgba(16, 185, 129, 0.15);
      background-color: var(--card-glass);
    }
    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      filter: contrast(108%) brightness(88%);
    }
    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 7, 6, 0.1) 0%, rgba(2, 7, 6, 0.85) 100%);
    }
    .banner-badge {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(2, 10, 8, 0.88);
      backdrop-filter: blur(10px);
      padding: 6px 18px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gold-light);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* İÇERİK KARTI */
    .hero-main-content {
      padding: 35px 20px 50px;
      max-width: 760px;
      margin: 20px auto 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--card-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .hero-tag {
      font-size: 10.5px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--emerald-accent);
      margin-bottom: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .hero-tag::before, .hero-tag::after {
      content: ''; width: 20px; height: 1px; background: var(--emerald-accent); opacity: 0.6;
    }
    .hero-title {
      font-family: 'Cinzel', 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-pearl);
      line-height: 1.25;
      margin-bottom: 18px;
    }
    .hero-title span {
      display: block;
      color: var(--gold-light);
      font-style: italic;
      font-size: 32px;
      background: linear-gradient(135deg, #ffffff 0%, #f7e8c3 45%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-desc {
      font-size: 13.5px;
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.85;
      margin-bottom: 26px;
      max-width: 620px;
    }
    .hero-desc strong { color: var(--gold-light); font-weight: 500; }

    /* ARAMA ÇUBUĞU */
    .search-wrapper { width: 100%; max-width: 500px; margin-bottom: 25px; }
    .search-box {
      display: flex;
      background: rgba(2, 6, 5, 0.75);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }
    .search-box:focus-within {
      border-color: var(--gold-primary);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-pearl);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      padding: 13px 16px;
    }
    .search-box input::placeholder { color: #6a7c76; }
    .search-box button {
      background: linear-gradient(135deg, #d4af37 0%, #a6811b 100%);
      border: none;
      color: #020605;
      padding: 0 22px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* BUTONLAR */
    .action-grid {
      width: 100%;
      max-width: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.3s ease;
      background: rgba(2, 6, 5, 0.65);
      border: 1px solid var(--card-border);
    }
    .btn-wp { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }
    .btn-ig { color: #f77062; border-color: rgba(247, 112, 98, 0.4); }
    .btn-tt { color: var(--text-pearl); border-color: rgba(255, 255, 255, 0.2); }
    .btn-map { color: var(--gold-light); border-color: var(--card-border); }
    .btn-action:hover {
      transform: translateY(-2px);
      filter: brightness(1.2);
      border-color: var(--gold-primary);
    }

    /* CANLI PİYASA PANELİ */
    .market-panel {
      width: 100%;
      max-width: 520px;
      background: rgba(3, 10, 8, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px 16px;
      margin-bottom: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(212, 175, 55, 0.05);
    }
    .market-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .market-brand { text-align: left; }
    .market-title {
      font-family: 'Cinzel', 'Cormorant Garamond', serif;
      font-size: 20px;
      color: var(--gold-light);
      font-weight: 700;
      letter-spacing: 1.5px;
      display: block;
      line-height: 1.1;
      text-transform: uppercase;
    }
    .market-sub {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .market-live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.35);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 9.5px;
      color: var(--emerald-accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--emerald-accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald-accent);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
    .market-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .market-table th {
      color: var(--text-muted);
      font-weight: 500;
      text-align: right;
      padding: 8px 6px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .market-table th:first-child { text-align: left; }
    .market-table td {
      padding: 10px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      text-align: right;
      color: var(--gold-light);
      font-weight: 600;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    .market-table td:first-child {
      text-align: left;
      color: var(--text-pearl);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .market-table td:first-child i { color: var(--gold-primary); font-size: 11px; }
    .market-table tr:hover td { background: rgba(212, 175, 55, 0.04); }
    .market-footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      padding: 0 4px;
    }
    .market-source { display: flex; align-items: center; gap: 4px; }
    .market-source i { color: var(--gold-primary); }

    /* ROZETLER */
    .features-list {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding-top: 24px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
    .feature-box h4 {
      font-family: 'Cinzel', 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--gold-light);
      margin-bottom: 3px;
    }
    .feature-box p { font-size: 10.5px; color: var(--text-muted); line-height: 1.4; }

    /* ====================================================
       KAPAKLI KATALOG & LÜKS İÇ VİTRİN
    ==================================================== */
    .catalog-section {
      width: 100%;
      max-width: 960px;
      margin: 10px auto 40px;
      padding: 0 16px;
    }
    .catalog-header { text-align: center; margin-bottom: 28px; }
    .catalog-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 900;
      color: var(--gold-primary);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .catalog-header p {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 5px;
    }
    .gold-divider { width: 45px; height: 2px; background: var(--gold-primary); margin: 12px auto 0; }

    /* KAPAKLAR GRID */
    .catalog-covers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .catalog-cover-card {
      background: var(--card-glass);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      text-align: center;
      display: flex;
      flex-direction: column;
    }
    .catalog-cover-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold-primary);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.25);
    }
    .cover-img-placeholder {
      height: 140px;
      background: radial-gradient(circle at center, #09261e 0%, #030a08 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      color: var(--gold-primary);
      gap: 8px;
    }
    .cover-img-placeholder i { font-size: 38px; color: var(--gold-primary); }
    .cover-info { padding: 14px 10px; }
    .cover-title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-open-cat {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: inline-block;
      transition: 0.2s;
    }
    .catalog-cover-card:hover .btn-open-cat {
      background: var(--gold-primary);
      color: #020605;
    }

    /* İÇ VİTRİN GÖRÜNÜMÜ */
    .catalog-inner-view {
      display: none;
    }
    .cat-back-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding: 14px 18px;
      background: rgba(4, 18, 14, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }
    .btn-cat-back {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--card-border);
      color: var(--gold-light);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-cat-back:hover { background: var(--gold-primary); color: #020605; }

    /* 10 ADET ÜRÜN KARTI GRİD */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .luxury-product-card {
      background: radial-gradient(circle at 50% 0%, #08221b 0%, #030c09 85%);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .luxury-product-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold-primary);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.2);
    }
    .jewel-display-stage {
      height: 160px;
      background: radial-gradient(circle at center, #0d352b 0%, #041410 75%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }
    .gold-hallmark {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 8.5px;
      font-weight: 800;
      color: #020605;
      background: linear-gradient(135deg, #d4af37, #f7e8c3);
      padding: 3px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .jewel-icon-wrap {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(2, 8, 6, 0.85);
      border: 1px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--gold-light);
    }
    .stage-label {
      font-size: 9px;
      color: var(--gold-light);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 8px;
      opacity: 0.85;
    }
    .jewel-details { padding: 14px; }
    .jewel-specs {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(212, 175, 55, 0.2);
      padding-bottom: 6px;
      margin-bottom: 8px;
      font-size: 9.5px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .jewel-name {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .jewel-subtext {
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .jewel-price-box {
      background: rgba(3, 12, 9, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .jewel-cost {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      font-weight: 800;
      color: var(--gold-light);
    }
    .jewel-btn-group { display: flex; gap: 6px; }
    .btn-lux-cart {
      flex: 1;
      background: transparent;
      border: 1px solid var
