<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bağmancı Ürün Detayı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-base: #020605;
      --panel: rgba(4, 15, 12, 0.92);
      --panel-soft: rgba(7, 22, 18, 0.78);
      --gold-primary: #d4af37;
      --gold-light: #f7e8c3;
      --border: rgba(212, 175, 55, 0.28);
      --text: #f7f6f2;
      --muted: #a3b3ae;
      --green: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(17, 42, 34, 0.45), rgba(2, 6, 5, 0.96) 58%), var(--bg-base);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      padding-bottom: 80px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(2, 7, 6, 0.94);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      text-align: center;
      backdrop-filter: blur(16px);
    }
    .brand-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-decoration: none;
    }
    .brand-sub {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--green);
      text-transform: uppercase;
      font-weight: 700;
    }
    .page {
      width: min(1120px, calc(100% - 28px));
      margin: 32px auto;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-light);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }
    .product-shell {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 28px;
      align-items: start;
    }
    .gallery-main {
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(212, 175, 55, 0.22);
      border-radius: 8px;
      min-height: 460px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .gallery-main img {
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: contain;
      padding: 28px;
    }
    .image-fallback {
      color: #101614;
      text-align: center;
      padding: 40px;
    }
    .image-fallback i {
      display: block;
      font-size: 64px;
      color: var(--gold-primary);
      margin-bottom: 16px;
    }
    .thumbs {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
    }
    .thumb {
      width: 86px;
      height: 86px;
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 6px;
      background: rgba(255,255,255,0.96);
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
    .detail-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-flex;
      color: #07120f;
      background: var(--gold-primary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.4px;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: 1px;
      color: var(--gold-light);
      margin-bottom: 14px;
    }
    .desc { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    .price {
      font-size: clamp(32px, 6vw, 54px);
      color: var(--text);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin-bottom: 10px;
    }
    .price-note { color: var(--gold-light); font-weight: 600; margin-bottom: 10px; }
    .sku { color: var(--muted); font-size: 13px; letter-spacing: 1px; margin-bottom: 26px; }
    .actions { display: grid; grid-template-columns: 140px 1fr 56px; gap: 12px; align-items: center; margin-bottom: 26px; }
    .qty {
      height: 54px;
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      background: rgba(2, 6, 5, 0.6);
      border-radius: 6px;
      overflow: hidden;
    }
    .qty button, .fav {
      height: 100%;
      border: none;
      background: transparent;
      color: var(--gold-light);
      font-size: 18px;
      cursor: pointer;
    }
    .qty span { text-align: center; font-weight: 800; font-size: 18px; }
    .buy {
      height: 54px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #d4af37 0%, #a6811b 100%);
      color: #020605;
      font-weight: 800;
      letter-spacing: 1.2px;
      cursor: pointer;
    }
    .fav {
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 6px;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.08);
    }
    .quick-specs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 26px;
    }
    .quick-spec {
      background: var(--panel-soft);
      border: 1px solid rgba(212, 175, 55, 0.16);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .quick-spec span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; }
    .quick-spec strong { display: block; color: var(--gold-light); font-size: 14px; margin-top: 3px; }
    .tabs {
      margin-top: 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
    }
    .tab-head { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    .tab-btn.active { background: rgba(212, 175, 55, 0.16); color: var(--gold-light); }
    .tab-body { padding: 20px; }
    .spec-section { margin-bottom: 18px; }
    .spec-section h3 {
      font-family: 'Cormorant Garamond', serif;
      color: var(--gold-light);
      font-size: 24px;
      margin-bottom: 8px;
    }
    .spec-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
    }
    .spec-row b { color: var(--text); }
    .spec-row span { color: var(--muted); }
    .app-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 62px;
      background: rgba(2, 7, 6, 0.96);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      border: none;
      background: none;
      font-size: 10px;
      cursor: pointer;
    }
    .app-item i { color: var(--gold-primary); font-size: 17px; margin-bottom: 3px; }
    @media (max-width: 820px) {
      .product-shell { grid-template-columns: 1fr; }
      .gallery-main { min-height: 320px; }
      .actions { grid-template-columns: 118px 1fr 52px; }
      .quick-specs { grid-template-columns: 1fr; }
      .spec-row { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand-logo">BAĞMANCI</a>
    <span class="brand-sub">Kuyumculuk & Saat</span>
  </header>

  <main class="page">
    <a class="back-link" href="index.html#katalog"><i class="fa-solid fa-arrow-left"></i> Kataloğa Dön</a>
    <section class="product-shell" id="product-shell">
      <div class="gallery">
        <div class="gallery-main" id="main-image"></div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <article class="detail-panel">
        <span class="badge" id="badge">ÜRÜN</span>
        <h1 id="product-name">Ürün yükleniyor...</h1>
        <p class="desc" id="short-description"></p>
        <div class="price" id="product-price">--</div>
        <div class="price-note" id="price-note"></div>
        <div class="sku" id="sku"></div>
        <div class="actions">
          <div class="qty">
            <button type="button" onclick="changeQty(-1)">-</button>
            <span id="qty">1</span>
            <button type="button" onclick="changeQty(1)">+</button>
          </div>
          <button class="buy" type="button" onclick="sendWhatsapp()">WHATSAPP SİPARİŞ</button>
          <button class="fav" type="button" title="Favori"><i class="fa-regular fa-heart"></i></button>
        </div>
        <div class="quick-specs" id="quick-specs"></div>
      </article>
    </section>

    <section class="tabs">
      <div class="tab-head">
        <button class="tab-btn active" type="button" onclick="showTab('features')">ÜRÜN ÖZELLİKLERİ</button>
        <button class="tab-btn" type="button" onclick="showTab('description')">ÜRÜN AÇIKLAMA</button>
        <button class="tab-btn" type="button" onclick="showTab('payment')">ÖDEME SEÇENEKLERİ</button>
        <button class="tab-btn" type="button" onclick="showTab('return')">İADE & DEĞİŞİM</button>
      </div>
      <div class="tab-body" id="tab-body"></div>
    </section>
  </main>

  <nav class="app-bar">
    <a class="app-item" href="index.html"><i class="fa-solid fa-house"></i><span>Ana Sayfa</span></a>
    <a class="app-item" href="index.html#borsa"><i class="fa-solid fa-chart-line"></i><span>Borsa</span></a>
    <a class="app-item" href="index.html#katalog"><i class="fa-solid fa-gem"></i><span>Katalog</span></a>
    <a class="app-item" href="https://wa.me/905324341261" target="_blank"><i class="fa-brands fa-whatsapp"></i><span>İletişim</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    let product = null;
    let qty = 1;
    let liveBilezikPrice = 0;

    function apiUrl(path) {
      const isLocalPreview = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocalPreview && path === '/api/sukob') {
        return 'https://bagmancikuyumculuk.com.tr/api/sukob';
      }
      return path;
    }

    function parseProductTable(text) {
      const cleanText = text.replace(/^\uFEFF/, '').trim();
      if (!cleanText) return [];

      const firstLine = cleanText.split(/\r?\n/)[0] || '';
      const delimiter = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < cleanText.length; i++) {
        const char = cleanText[i];
        const next = cleanText[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === delimiter && !inQuotes) {
          row.push(cell.trim());
          cell = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(cell.trim());
          rows.push(row);
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }

      row.push(cell.trim());
      rows.push(row);

      const headers = rows.shift().map(header => header.trim());
      return rows
        .filter(values => values.some(value => value.trim()))
        .map(values => {
          const item = {};
          headers.forEach((header, index) => {
            item[header] = values[index] || '';
          });
          return tableRowToProduct(item);
        });
    }

    function toNumber(value) {
      if (value === null || value === undefined || value === '') return null;
      const number = Number(String(value).replace(',', '.'));
      return Number.isFinite(number) ? number : null;
    }

    function field(row, camel, snake = camel) {
      return row[camel] ?? row[snake] ?? '';
    }

    function tableRowToProduct(row) {
      const rawImages = field(row, 'images');
      const images = Array.isArray(rawImages)
        ? rawImages.filter(Boolean)
        : String(rawImages || '').split('|').map(image => image.trim()).filter(Boolean);
      const gram = toNumber(field(row, 'gram'));
      const fixedPrice = toNumber(field(row, 'fixedPrice', 'fixed_price'));
      const labor = toNumber(field(row, 'labor')) || 0;
      const category = field(row, 'category');
      const sku = field(row, 'sku');
      const material = field(row, 'material');
      const ayar = field(row, 'ayar');
      const renk = field(row, 'renk');
      const tas = field(row, 'tas');
      const olcu = field(row, 'olcu');
      const stok = field(row, 'stok');
      const shortDescription = field(row, 'shortDescription', 'short_description');
      const description = field(row, 'description') || shortDescription;
      const features = [
        ['Kategori', category],
        ['Stok Kodu', sku],
        ['Materyal', material],
        ['Ayar', ayar],
        ['Gram', gram ? `${gram.toLocaleString('tr-TR')} gr` : ''],
        ['Renk', renk],
        ['Taş', tas],
        ['Ölçü', olcu],
        ['Stok', stok]
      ].filter(([, value]) => value !== null && value !== undefined && String(value).trim())
       .map(([label, value]) => ({ label, value: String(value) }));

      return {
        id: field(row, 'id'),
        name: field(row, 'name'),
        category,
        sku,
        badge: field(row, 'badge') || category,
        priceMode: field(row, 'priceMode', 'price_mode') || (gram ? 'liveGram' : 'fixed'),
        gram,
        labor,
        fixedPrice,
        images,
        shortDescription,
        description,
        features,
        sections: [
          {
            title: 'Ürün Özellikleri',
            items: features
          }
        ]
      };
    }

    async function loadProductsFromSupabase() {
      const cfg = window.BAGMANCI_SUPABASE || {};
      if (!cfg.url || !cfg.anonKey || !window.supabase) return [];
      const client = window.supabase.createClient(cfg.url, cfg.anonKey);
      const { data, error } = await client
        .from('products')
        .select('*')
        .eq('active', true)
        .order('created_at', { ascending: false });
      if (error) throw error;
      return (data || []).map(tableRowToProduct);
    }

    async function loadProductsData() {
      try {
        const supabaseProducts = await loadProductsFromSupabase();
        if (supabaseProducts.length) return supabaseProducts;
      } catch (error) {
        console.warn('Supabase ürünleri okunamadı, yerel dosyalar deneniyor:', error);
      }

      try {
        const csvResponse = await fetch('products.csv', { cache: 'no-store' });
        if (csvResponse.ok) {
          const csvProducts = parseProductTable(await csvResponse.text());
          if (csvProducts.length) return csvProducts;
        }
      } catch (error) {
        console.warn('products.csv okunamadı, products.json deneniyor:', error);
      }

      const jsonResponse = await fetch('products.json', { cache: 'no-store' });
      if (!jsonResponse.ok) throw new Error(`products.json HTTP ${jsonResponse.status}`);
      return jsonResponse.json();
    }
    function money(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '--';
      return number.toLocaleString('tr-TR');
    }

    function productPrice(item) {
      if (item.priceMode === 'liveGram' && Number(item.gram) && liveBilezikPrice) {
        return Math.round((Number(item.gram) * liveBilezikPrice) + Number(item.labor || 0));
      }
      return Number(item.fixedPrice || 0);
    }

    function renderImage(src) {
      const main = document.getElementById('main-image');
      if (!src) {
        main.innerHTML = '<div class="image-fallback"><i class="fa-solid fa-gem"></i><strong>Ürün görseli yakında</strong></div>';
        return;
      }
      main.innerHTML = `<img src="${src}" alt="${product.name}" onerror="renderImage('')">`;
    }

    function renderProduct() {
      document.title = `${product.name} | Bağmancı Kuyumculuk`;
      document.getElementById('badge').innerText = product.badge || product.category || 'ÜRÜN';
      document.getElementById('product-name').innerText = product.name;
      document.getElementById('short-description').innerText = product.shortDescription || '';
      document.getElementById('sku').innerText = product.sku || '';

      const price = productPrice(product);
      document.getElementById('product-price').innerText = price ? money(price) : 'Fiyat için iletişime geçin';
      document.getElementById('price-note').innerText = product.priceMode === 'liveGram'
        ? `${product.gram} gr x canlı 22 ayar satış kuru`
        : 'Sabit mağaza fiyatı';

      const images = Array.isArray(product.images) ? product.images : [];
      renderImage(images[0]);
      document.getElementById('thumbs').innerHTML = images.map(src => `
        <button class="thumb" type="button" onclick="renderImage('${src}')">
          <img src="${src}" alt="${product.name}" onerror="this.parentElement.style.display='none'">
        </button>
      `).join('');

      document.getElementById('quick-specs').innerHTML = (product.features || []).map(item => `
        <div class="quick-spec"><span>${item.label}</span><strong>${item.value}</strong></div>
      `).join('');

      showTab('features');
    }

    function showTab(name) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const active = [...document.querySelectorAll('.tab-btn')].find(btn => btn.textContent.toLocaleLowerCase('tr-TR').includes(name === 'features' ? 'özellik' : name === 'description' ? 'açıklama' : name === 'payment' ? 'ödeme' : 'iade'));
      if (active) active.classList.add('active');

      const body = document.getElementById('tab-body');
      if (name === 'description') {
        body.innerHTML = `<p>${product.description || product.shortDescription || 'Ürün açıklaması yakında eklenecek.'}</p>`;
        return;
      }
      if (name === 'payment') {
        body.innerHTML = '<p>Ödeme seçenekleri, taksit ve teslim bilgileri için mağazamızla iletişime geçebilirsiniz.</p>';
        return;
      }
      if (name === 'return') {
        body.innerHTML = '<p>İade ve değişim işlemleri ürünün durumuna, kişiye özel işlem görüp görmediğine ve mağaza kontrolüne göre değerlendirilir.</p>';
        return;
      }

      body.innerHTML = (product.sections || []).map(section => `
        <div class="spec-section">
          <h3>${section.title}</h3>
          ${(section.items || []).map(row => `<div class="spec-row"><b>${row.label}</b><span>${row.value}</span></div>`).join('')}
        </div>
      `).join('') || '<p>Ürün özellikleri yakında eklenecek.</p>';
    }

    function changeQty(step) {
      qty = Math.max(1, qty + step);
      document.getElementById('qty').innerText = qty;
    }

    function sendWhatsapp() {
      const price = productPrice(product);
      const text = `Merhaba, ${product.name} (${product.sku || product.id}) ürünü hakkında bilgi almak istiyorum. Adet: ${qty}. Fiyat: ${price ? money(price) : 'iletişim'}`;
      window.open(`https://wa.me/905324341261?text=${encodeURIComponent(text)}`, '_blank');
    }

    async function loadLivePrice() {
      try {
        const response = await fetch(`${apiUrl('/api/sukob')}?cache=${Date.now()}`, { cache: 'no-store' });
        const data = await response.json();
        const bilezik = data.find(item => item.url === '22_ayar_bilezik');
        liveBilezikPrice = Math.round(Number(bilezik?.sellPrice || 0));
      } catch (error) {
        liveBilezikPrice = 0;
      }
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const [products] = await Promise.all([
        loadProductsData(),
        loadLivePrice()
      ]);
      product = products.find(item => item.id === id) || products[0];
      renderProduct();
    }

    init().catch(() => {
      document.getElementById('product-shell').innerHTML = '<p>Ürün bilgisi yüklenemedi.</p>';
    });
  </script>
</body>
</html>
